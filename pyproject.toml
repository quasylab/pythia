[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia"
version = "0.1.0"
description = "A modular simulation framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["simulation", "modelling", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime dependencies kept intentionally minimal. Domain-specific needs
# belong in optional extras, not in the core api layer.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.0",
]
# Placeholder extras for future modules.
models = []
visualization = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Documentation = "https://quasylab.github.io/pythia/"
Repository = "https://github.com/quasylab/pythia"
Issues = "https://github.com/quasylab/pythia/issues"

[tool.hatch.build.targets.wheel]
packages = ["pythia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["pythia"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
strict = true
packages = ["pythia"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
